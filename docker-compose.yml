# Local run: `docker compose up -d --build`, then open http://localhost:8088
# Backend code is bind-mounted; the React app is built once by the `node` service.
# For hot reload, run `npm run dev` in web/ (http://localhost:5173).
name: service-scheduler

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: service-scheduler-php:dev
  volumes:
    - ./api:/var/www/api
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  php:
    <<: *php
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # NFR-07: `docker compose up` gives a ready database with seed data and accounts.
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # php-fpm only listens after the entrypoint has finished composer install and migrations.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      php:
        condition: service_healthy

  node:
    image: node:24-alpine
    working_dir: /var/www/web
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build"]
    volumes:
      - ./web:/var/www/web
      # Linux node_modules stay in the container; the host keeps its own copy.
      - node_modules:/var/www/web/node_modules

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./web/dist:/var/www/web/dist:ro
      - ./api/public:/var/www/api/public:ro
    depends_on:
      php:
        condition: service_healthy
      node:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
