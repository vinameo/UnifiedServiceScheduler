<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer chooses service</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1971c2}a:hover{color:#1864ab}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 18px;border-radius:8px;border:1px solid #1971c2;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:#1971c2;color:#fff;box-sizing:border-box}
.btn:hover{background:#1864ab;color:#fff}
.dim{color:#495057}
.sm{font-size:13px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:#dee2e6}
.steps span.on{background:#1971c2}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1px solid #dee2e6;border-radius:8px;background:#fff;font:inherit;color:#212529;cursor:pointer;box-sizing:border-box}
.opt:hover{border-color:#ced4da;background:#f8f9fa}
.opt.on{border:2px solid #1971c2;padding:13px 15px;background:#e7f5ff}
.ico{width:40px;height:40px;border-radius:8px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;background:#f1f3f5;color:#495057}
.opt.on .ico{background:#1971c2;color:#fff}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #ced4da;box-sizing:border-box;flex:0 0 20px;margin-top:10px}
.opt.on .radio{border:6px solid #1971c2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f8f9fa; color: #212529; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column">
<header style="padding: 12px 16px; background: #fff; border-bottom: 1px solid #dee2e6; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 8px; background: #1971c2; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0M15 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0M5 17H3v-6l2-5h9l4 5h1a2 2 0 0 1 2 2v4h-2M9 17h6M3 11h15"></path></svg></span><div style="line-height: 1.3"><div style="font-weight: 700">Saigon Auto</div><div class="dim sm">District 7 branch</div></div></div>
<a href="CustomerMyBookings.dc.html" style="min-height: 44px; display: flex; align-items: center; font-weight: 600; text-decoration: none">My bookings</a>
</div>
<div><div style="font-weight: 700; font-size: 18px">Book a service</div><div class="dim sm">Step 1 of 3 · Choose a service</div></div>
<div class="steps" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
</header>
<div style="flex: 1 1 auto; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div role="radiogroup" aria-label="Service" style="display: flex; flex-direction: column; gap: 12px">
<button class="{{oilCls}}" type="button" role="radio" onClick="{{pickOil}}"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"></path></svg></span><span style="flex: 1 1 auto"><span style="display: block; font-weight: 600">Oil change</span><span class="dim sm" style="display: block">About 60 min · oil and oil filter</span></span><span class="radio"></span></button>
<button class="{{maintCls}}" type="button" role="radio" onClick="{{pickMaint}}"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10h3V7L6.5 3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8L7 10"></path></svg></span><span style="flex: 1 1 auto"><span style="display: block; font-weight: 600">20,000 km service</span><span class="dim sm" style="display: block">About 2 hours · full manufacturer checklist</span></span><span class="radio"></span></button>
<button class="{{evCls}}" type="button" role="radio" onClick="{{pickEv}}"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7l8-11h-6l1-7z"></path></svg></span><span style="flex: 1 1 auto"><span style="display: block; font-weight: 600">EV battery check</span><span class="dim sm" style="display: block">About 90 min · by a high-voltage certified technician</span></span><span class="radio"></span></button>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; background: #fff; border: 1px solid #dee2e6">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 18px; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
<div class="dim sm">Can't find what you need? Call <a href="tel:02838123456" style="font-weight: 600">028 3812 3456</a> and a service advisor will book it for you.</div>
</div>
</div>
<footer style="padding: 12px 16px 20px; background: #fff; border-top: 1px solid #dee2e6; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between" class="sm"><span class="dim">Selected</span><span style="font-weight: 600">{{chosen}}</span></div>
<a class="btn" href="CustomerSlots.dc.html">Choose date and time</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { svc: 'oil' };
  }
  renderVals() {
    const s = this.state.svc;
    const N = { oil: 'Oil change · 60 min', maint: '20,000 km service · 120 min', ev: 'EV battery check · 90 min' };
    const cls = (k) => (s === k ? 'opt on' : 'opt');
    return {
      oilCls: cls('oil'), maintCls: cls('maint'), evCls: cls('ev'),
      chosen: N[s],
      pickOil: () => this.setState({ svc: 'oil' }),
      pickMaint: () => this.setState({ svc: 'maint' }),
      pickEv: () => this.setState({ svc: 'ev' })
    };
  }
}
</script>
</body>
</html>
