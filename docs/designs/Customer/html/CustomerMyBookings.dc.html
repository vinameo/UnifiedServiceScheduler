<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My bookings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1971c2}a:hover{color:#1864ab}
.dim{color:#495057}
.sm{font-size:13px}
.seg{display:flex;gap:4px;padding:4px;background:#f1f3f5;border-radius:8px}
.sg{flex:1;min-height:40px;border:none;border-radius:4px;background:transparent;font:inherit;font-weight:500;color:#495057;cursor:pointer}
.sg.on{background:#fff;color:#212529;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bk{display:flex;flex-direction:column;gap:10px;padding:16px;background:#fff;border:1px solid #dee2e6;border-radius:8px;text-decoration:none;color:#212529}
.bk:hover{border-color:#ced4da;color:#212529;background:#fff}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.b-blue{background:#e7f5ff;color:#1864ab}.b-green{background:#ebfbee;color:#1e6b2f}.b-gray{background:#f1f3f5;color:#495057}
.tabbar{display:flex;background:#fff;border-top:1px solid #dee2e6;padding:4px 8px 16px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:#495057;text-decoration:none;font-size:12px;font-weight:500}
.tb:hover{color:#212529}
.tb.on{color:#1864ab;font-weight:600}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f8f9fa; color: #212529; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column">
<header style="padding: 16px; background: #fff; border-bottom: 1px solid #dee2e6; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">My bookings</h1><div class="dim sm">Signed in as 0903 *** 218</div></div>
<button type="button" style="min-height: 44px; padding: 0 8px; border: none; background: none; font: inherit; font-weight: 600; color: #1971c2; cursor: pointer">Sign out</button>
</div>
<div class="seg" role="group" aria-label="Filter appointments">
<button class="{{upCls}}" type="button" onClick="{{showUp}}">Upcoming</button>
<button class="{{pastCls}}" type="button" onClick="{{showPast}}">Past</button>
</div>
</header>
<div style="flex: 1 1 auto; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="b" hint-placeholder-count="1">
<a class="bk" href="CustomerBooking.dc.html">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="font-weight: 700; font-size: 16px">{{b.when}}</span><span class="{{b.badgeCls}}">{{b.status}}</span></div>
<div><div style="font-weight: 500">{{b.service}}</div><div class="dim sm">{{b.vehicle}} · Saigon Auto District 7</div></div>
<div style="display: flex; justify-content: space-between; align-items: center" class="sm"><span class="dim" style="font-variant-numeric: tabular-nums">{{b.id}}</span><span style="font-weight: 600; color: #1971c2">View details</span></div>
</a>
</sc-for>
<sc-if value="{{isUp}}" hint-placeholder-val="{{true}}">
<a href="CustomerService.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1px dashed #ced4da; border-radius: 8px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New booking</a>
</sc-if>
</div>
<nav class="tabbar" aria-label="Navigation">
<a class="tb" href="CustomerService.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M4 11h16M12 14v4M10 16h4"></path></svg>New booking</a>
<a class="tb on" href="CustomerMyBookings.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M5 6v.01M5 12v.01M5 18v.01"></path></svg>My bookings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'up' };
  }
  renderVals() {
    const up = this.state.tab === 'up';
    const UP = [
      { when: 'Mon 2 Nov · 10:00', status: 'Confirmed', badgeCls: 'badge b-blue', service: 'Oil change · 60 min', vehicle: 'Toyota Vios 51H-123.45', id: 'APT-20261102-0042' }
    ];
    const PAST = [
      { when: 'Sat 15 Aug · 08:30', status: 'Completed', badgeCls: 'badge b-green', service: '10,000 km service', vehicle: 'Toyota Vios 51H-123.45', id: 'APT-20260815-0007' },
      { when: 'Wed 20 May · 14:00', status: 'Cancelled', badgeCls: 'badge b-gray', service: 'Oil change', vehicle: 'Toyota Vios 51H-123.45', id: 'APT-20260520-0019' }
    ];
    return {
      items: up ? UP : PAST,
      isUp: up,
      upCls: up ? 'sg on' : 'sg',
      pastCls: up ? 'sg' : 'sg on',
      showUp: () => this.setState({ tab: 'up' }),
      showPast: () => this.setState({ tab: 'past' })
    };
  }
}
</script>
</body>
</html>
