[www]
; Keep the container's environment (DB_*, APP_KEY, ...) visible to workers.
clear_env = no

; Many short-lived workers; nothing is kept in worker memory between requests.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Plain access log off: nginx logs each request and Laravel logs JSON to stderr.
access.log = /dev/null
