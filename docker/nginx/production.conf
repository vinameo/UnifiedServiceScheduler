# Production (docker-compose.prod.yml): HTTPS only (NFR-05).
# Certificates are mounted at /etc/nginx/certs (fullchain.pem, privkey.pem).
server {
    listen 80;
    server_name _;

    location = /health/live {
        # Lets a load balancer probe the container without TLS.
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_pass php:9000;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/app.conf;
}
