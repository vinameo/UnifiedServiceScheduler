# Shared by default.conf (local, HTTP) and production.conf (HTTPS).
root /var/www/web/dist;
index index.html;

server_tokens off;
client_max_body_size 10m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

gzip on;
gzip_types text/plain text/css application/json application/problem+json application/javascript image/svg+xml;

# Metrics are for the Docker network only (FR-08.5), never the public site.
location ^~ /metrics {
    return 404;
}

location ~ ^/(api|sanctum|health)(/|$) {
    root /var/www/api/public;
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    root /var/www/api/public;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
    fastcgi_pass php:9000;
}

# Vite puts hashed file names under /assets, so they can be cached for a long time.
location /assets/ {
    # `expires`, not add_header: add_header here would drop the security headers above.
    expires 1y;
    try_files $uri =404;
}

location / {
    # React SPA fallback; index.html itself must never be cached.
    expires -1;
    try_files $uri /index.html;
}
